<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- SEO & Social Meta Tags -->
  <title>Altay &mdash; Interaktif Tarih & Kültürel Miras Haritası</title>
  <meta name="description" content="Tüm dünyadaki ve yakınınızdaki tarihi mekanları, antik kentleri, müzeleri, kale ve surları interaktif harita üzerinde keşfedin, sesli rehber ile dinleyin." />
  <meta name="keywords" content="altay, tarih haritası, tarihi yerler, gezilecek yerler, antik kentler, müzeler, sesli rehber, overpass api, leaflet" />
  <meta name="author" content="an1lbayram" />
  <meta name="theme-color" content="#0d9488" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Altay - Interaktif Tarih & Kültürel Miras Haritası" />
  <meta property="og:description" content="Çevrenizdeki tarihi ve turistik eserleri detaylı bilgiler ve sesli anlatım ile keşfedin." />
  <meta property="og:image" content="/favicon.svg" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Altay - Interaktif Tarih Haritası" />
  <meta name="twitter:description" content="Tarihi eserleri ve antik kentleri harita üzerinde canlı keşfedin." />

  <!-- Favicon & PWA -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Main CSS bundle -->
  <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased overflow-hidden select-none transition-colors duration-300">

  <!-- Application Shell Wrapper -->
  <div id="app" class="relative w-full h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="h-[72px] bg-white/90 dark:bg-slate-950/90 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800/80 px-4 z-40 flex items-center justify-between gap-4 shadow-sm transition-colors duration-300">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-3 flex-shrink-0">
        <div id="logoReloadBtn" class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-teal-600 to-teal-400 flex items-center justify-center shadow-lg shadow-teal-500/20 text-white text-lg cursor-pointer">
          <i class="fa-solid fa-map-location-dot"></i>
        </div>
        <div class="hidden sm:block">
          <h1 id="titleReloadBtn" class="text-lg font-extrabold tracking-tight text-slate-900 dark:text-white leading-none flex items-center gap-1.5 cursor-pointer">
            Altay
          </h1>
          <a href="https://an1lbayram-github-io.vercel.app/" target="_blank" rel="noopener noreferrer" class="text-[10px] font-mono text-teal-600 dark:text-teal-400 hover:underline mt-0.5 block font-bold transition-all">
            &lt;/&gt; Created by an1lbayram
          </a>
        </div>
      </div>

      <!-- Search & Main Controls -->
      <div class="flex-1 max-w-xl relative flex items-center gap-2">
        
        <!-- Search Input Container -->
        <div class="relative w-full">
          <div class="relative flex items-center">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-slate-400 text-xs pointer-events-none"></i>
            <input type="text" id="searchInput" 
              class="w-full bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200/60 dark:hover:bg-slate-800 focus:bg-white dark:focus:bg-slate-800 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-400 text-xs rounded-2xl py-2.5 pl-9 pr-9 border border-slate-200 dark:border-slate-700/80 focus:border-teal-500 focus:outline-none focus:ring-2 focus:ring-teal-500/20 transition-all shadow-inner"
              placeholder="Şehir, ilçe veya tarihi mekan ara..." autocomplete="off" />
          </div>

          <!-- Autocomplete Suggestions Dropdown -->
          <div id="searchSuggestions" class="hidden absolute top-full left-0 right-0 mt-2 bg-white/95 dark:bg-slate-900/95 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl overflow-hidden z-50 max-h-60 overflow-y-auto backdrop-blur-xl"></div>
        </div>

        <!-- Locate Me Button -->
        <button id="locateBtn" class="bg-teal-600 hover:bg-teal-500 text-white p-2.5 rounded-2xl shadow-lg shadow-teal-600/30 transition-all active:scale-95 flex items-center justify-center w-9 h-9 flex-shrink-0" title="Mevcut Konumum">
          <i class="fa-solid fa-crosshairs text-sm"></i>
        </button>

      </div>

      <!-- Right Action Controls -->
      <div class="flex items-center gap-2 flex-shrink-0">
        
        <!-- PWA Install Button (Hidden by default) -->
        <button id="pwaInstallBtn" class="hidden bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-bold px-3 py-2 rounded-2xl shadow-lg transition-all flex items-center gap-1.5">
          <i class="fa-solid fa-download"></i> <span class="hidden md:inline">Uygulamayı Yükle</span>
        </button>

        <!-- Map Layer Switcher Button -->
        <div class="relative">
          <button id="layerToggleBtn" class="w-9 h-9 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-2xl flex items-center justify-center border border-slate-200 dark:border-slate-700/80 transition-all" title="Harita Katmanı">
            <i class="fa-solid fa-layer-group text-xs"></i>
          </button>

          <!-- Layer Switcher Menu -->
          <div id="layerMenu" class="hidden absolute right-0 top-full mt-2 w-48 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl p-1.5 z-50 space-y-1 backdrop-blur-xl">
            <button data-tile="streets" class="w-full text-left px-3 py-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-semibold flex items-center gap-2 text-slate-800 dark:text-slate-300">
              <i class="fa-solid fa-map text-teal-500"></i> Sokak Haritası
            </button>
            <button data-tile="satellite" class="w-full text-left px-3 py-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-semibold flex items-center gap-2 text-slate-800 dark:text-slate-300">
              <i class="fa-solid fa-globe text-amber-500"></i> Uydu Görüntüsü
            </button>
            <button data-tile="topo" class="w-full text-left px-3 py-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-semibold flex items-center gap-2 text-slate-800 dark:text-slate-300">
              <i class="fa-solid fa-mountain text-emerald-500"></i> Topoğrafik Topo Harita
            </button>
            <button data-tile="dark" class="w-full text-left px-3 py-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-semibold flex items-center gap-2 text-slate-800 dark:text-slate-300">
              <i class="fa-solid fa-moon text-indigo-500"></i> Gece Modu Harita
            </button>
          </div>
        </div>

        <!-- Theme Mode Toggle Button -->
        <button id="themeToggleBtn" class="w-9 h-9 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-2xl flex items-center justify-center border border-slate-200 dark:border-slate-700/80 transition-all" title="Aydınlık / Karanlık Mod">
          <i class="fa-solid fa-sun text-amber-500 dark:hidden"></i>
          <i class="fa-solid fa-moon text-indigo-400 hidden dark:block"></i>
        </button>

        <!-- Sidebar / Drawer Toggle (Mobile) -->
        <button id="sidebarToggleBtn" class="md:hidden w-9 h-9 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-2xl flex items-center justify-center border border-slate-200 dark:border-slate-700/80 transition-all" title="Mekan Listesi">
          <i class="fa-solid fa-list-ul text-xs"></i>
        </button>
      </div>

    </header>

    <!-- Sub-header Filter & Slider Bar -->
    <div class="bg-white/80 dark:bg-slate-950/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800/60 px-4 py-2 z-30 flex items-center justify-between gap-4 overflow-x-auto transition-colors duration-300">
      
      <!-- Category Filter Pills -->
      <div id="categoryContainer" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5"></div>

      <!-- Distance Slider Control -->
      <div class="flex items-center gap-3 bg-slate-100 dark:bg-slate-900/90 border border-slate-200 dark:border-slate-800 px-3.5 py-1.5 rounded-2xl flex-shrink-0">
        <span class="text-xs text-slate-700 dark:text-slate-300 font-semibold whitespace-nowrap">Yarıçap: <span id="radiusValue" class="text-teal-600 dark:text-teal-400 font-bold">5</span> km</span>
        <input type="range" id="radiusSlider" min="1" max="50" value="5" class="w-24 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-teal-500">
      </div>

    </div>

    <!-- Map Canvas & Floating Panels Layout -->
    <main class="relative flex-1 w-full h-full overflow-hidden">
      
      <!-- Leaflet Map Canvas -->
      <div id="map" class="w-full h-full z-0 bg-slate-100 dark:bg-slate-900"></div>

      <!-- Desktop Sidebar / Mobile Drawer Panel -->
      <aside id="sidebar" class="absolute top-4 right-4 bottom-4 w-80 sm:w-96 bg-white/95 dark:bg-slate-950/90 backdrop-blur-xl border border-slate-200 dark:border-slate-800 rounded-3xl p-4 shadow-2xl z-20 transition-transform duration-300 transform md:translate-x-0 translate-x-full flex flex-col">
        <div id="sidebar-content" class="flex-1 flex flex-col min-h-0"></div>
      </aside>

    </main>

  </div>

  <!-- Entry JavaScript Module -->
  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
