name: Update visual regression baselines

# Playwright keys screenshot baselines by platform (…-win32.png, …-linux.png, …-darwin.png).
# The ones committed from local development are Windows baselines and are never used to
# compare against CI (Linux) runs. Run this workflow once (and again whenever the UI
# intentionally changes) to generate real Linux baselines and open a PR with them — until
# that PR is merged, CI has no Linux baseline and will auto-create+pass on first run,
# providing no real regression protection.
on:
  workflow_dispatch: {}

jobs:
  update-baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/visual.spec.js --project="Desktop Chrome (PC)" --update-snapshots
      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "test: update Linux visual regression baselines"
          title: "test: update Linux visual regression baselines"
          body: Auto-generated by the `update-visual-baselines` workflow.
          branch: update-visual-baselines
          add-paths: tests/visual.spec.js-snapshots/**
